schema_version: '1.0'
defaults: []
experiment:
  name: ablation_augmentation
  tags:
  - ablation
  - augmentation
  notes: 'Augmentation on: random crop and horizontal flip.'
  seed: 42
data:
  adapter: torchvision
  root: /Users/pengzhao/Documents/Projects/git_repos/CNN_Classifier/data
  manifest: null
  image_root: null
  class_names: auto
  num_classes: 10
  channels: rgb
  image_size:
  - 32
  - 32
  split:
    mode: random
    val_fraction: 0.1
    seed: 42
    group_column: null
  normalization:
    mode: supplied
    mean:
    - 0.4914
    - 0.4822
    - 0.4465
    std:
    - 0.247
    - 0.2435
    - 0.2616
    cache: true
  transforms:
    train:
    - name: RandomHorizontalFlip
      p: 0.5
    - name: RandomCrop
      size: 32
      padding: 4
    - name: ToTensor
    - name: Normalize
      mean: auto
      std: auto
    eval:
    - name: ToTensor
    - name: Normalize
      mean: auto
      std: auto
  value_range:
    mode: auto
    min: null
    max: null
  adapter_params:
    dataset: CIFAR10
    download: true
    max_train_samples: 10000
    max_val_samples: 2000
model:
  name: residual_cnn
  params:
    stem:
      channels: 32
      kernel_size: 3
      stride: 1
      pool: false
    stages:
    - channels: 32
      conv: false
      blocks: 1
      downsample: maxpool
    - channels: 64
      conv: true
      blocks: 1
      downsample: maxpool
    - channels: 128
      conv: true
      blocks: 1
      downsample: none
    dropout: 0.2
    norm: batch
    residual: true
  transfer:
    weights: null
    freeze: none
    train_bn: false
    unfreeze_schedule: []
    param_groups: []
training:
  epochs: 8
  batch_size: 128
  grad_accum_steps: 1
  selection_metric: val_accuracy
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.0005
    momentum: 0.9
  scheduler:
    name: cosine
    warmup_epochs: 0
    min_lr_ratio: 0.0
    step_size: 10
    gamma: 0.1
    step_unit: epoch
  loss:
    name: cross_entropy
    label_smoothing: 0.0
  grad_clip_norm: null
  amp: auto
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  ema:
    enabled: false
    decay: 0.999
  early_stopping:
    enabled: true
    monitor: val_accuracy
    mode: max
    patience: 10
    min_delta: 0.0
  checkpoint:
    monitor: val_accuracy
    mode: max
    save_last: true
evaluation:
  metrics:
  - accuracy
  - top_k
  - macro_f1
  - per_class
  - confusion_matrix
  - ece
  - nll
  top_k: 3
  bootstrap:
    enabled: true
    n_resamples: 1000
    confidence: 0.95
    stratify: true
  calibration:
    bins: 15
  latency:
    enabled: false
    warmup: 20
    iterations: 100
  error_analysis:
    max_examples: 32
  tta:
    enabled: false
    transforms:
    - identity
    - hflip
    reduction: mean_probabilities
tracking:
  console: true
  csv: true
  tensorboard: true
report:
  enabled: true
  formats:
  - html
  - markdown
  figures:
  - training_history
  - confusion_matrix
  - per_class
  - calibration
  - errors
  - model_summary
runtime:
  device: auto
  deterministic: true
  num_workers: auto
  persistent_workers: true
  pin_memory: auto
  channels_last: false
  compile: false
