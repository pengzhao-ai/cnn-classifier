schema_version: '1.0'
defaults: []
experiment:
  name: cifar10_resnet18_linear_probe
  tags:
  - cifar10
  - transfer
  - resnet18
  - linear-probe
  notes: Frozen ImageNet ResNet-18 backbone with a trained linear head.
  seed: 42
data:
  adapter: torchvision
  root: /Users/pengzhao/Documents/Projects/git_repos/CNN_Classifier/data
  manifest: null
  image_root: null
  class_names: auto
  num_classes: 10
  channels: rgb
  image_size:
  - 32
  - 32
  split:
    mode: random
    val_fraction: 0.1
    seed: 42
    group_column: null
  normalization:
    mode: supplied
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
    cache: true
  transforms:
    train:
    - name: RandomHorizontalFlip
      p: 0.5
    - name: RandomCrop
      size: 32
      padding: 4
    - name: ColorJitter
      brightness: 0.1
      contrast: 0.1
    - name: ToTensor
    - name: Normalize
      mean: auto
      std: auto
    - name: RandomErasing
      p: 0.1
    eval:
    - name: ToTensor
    - name: Normalize
      mean: auto
      std: auto
  value_range:
    mode: auto
    min: null
    max: null
  adapter_params:
    dataset: CIFAR10
    download: true
model:
  name: torchvision
  params:
    model: resnet18
    stem_adaptation: keep_7x7_stride1
    dropout: 0.0
  transfer:
    weights: IMAGENET1K_V1
    freeze: backbone
    train_bn: false
    unfreeze_schedule: []
    param_groups: []
training:
  epochs: 30
  batch_size: 128
  grad_accum_steps: 1
  selection_metric: val_accuracy
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.0005
    momentum: 0.9
  scheduler:
    name: cosine
    warmup_epochs: 0
    min_lr_ratio: 0.0
    step_size: 10
    gamma: 0.1
    step_unit: epoch
  loss:
    name: cross_entropy
    label_smoothing: 0.0
  grad_clip_norm: null
  amp: auto
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  ema:
    enabled: false
    decay: 0.999
  early_stopping:
    enabled: true
    monitor: val_accuracy
    mode: max
    patience: 10
    min_delta: 0.0
  checkpoint:
    monitor: val_accuracy
    mode: max
    save_last: true
evaluation:
  metrics:
  - accuracy
  - top_k
  - macro_f1
  - per_class
  - confusion_matrix
  - ece
  - nll
  top_k: 3
  bootstrap:
    enabled: true
    n_resamples: 1000
    confidence: 0.95
    stratify: true
  calibration:
    bins: 15
  latency:
    enabled: true
    warmup: 20
    iterations: 100
  error_analysis:
    max_examples: 32
  tta:
    enabled: false
    transforms:
    - identity
    - hflip
    reduction: mean_probabilities
tracking:
  console: true
  csv: true
  tensorboard: true
report:
  enabled: true
  formats:
  - html
  - markdown
  figures:
  - training_history
  - confusion_matrix
  - per_class
  - calibration
  - errors
  - model_summary
runtime:
  device: auto
  deterministic: true
  num_workers: auto
  persistent_workers: true
  pin_memory: auto
  channels_last: false
  compile: false
