schema_version: "1.0"

runtime:
  device: auto
  deterministic: true
  num_workers: auto
  persistent_workers: true
  pin_memory: auto
  channels_last: false
  compile: false

tracking:
  console: true
  csv: true
  tensorboard: true

report:
  enabled: true
  formats: [html, markdown]
  figures:
    - training_history
    - confusion_matrix
    - per_class
    - calibration
    - errors
    - model_summary

evaluation:
  metrics: [accuracy, top_k, macro_f1, per_class, confusion_matrix, ece, nll]
  top_k: 3
  bootstrap:
    enabled: true
    n_resamples: 1000
    confidence: 0.95
    stratify: true
  calibration:
    bins: 15
  latency:
    enabled: true
    warmup: 20
    iterations: 100
  error_analysis:
    max_examples: 32
  tta:
    enabled: false
    transforms: [identity, hflip]
    reduction: mean_probabilities
