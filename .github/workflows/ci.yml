name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-extras --no-editable
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy src

  test:
    name: Test ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep one Apple Silicon job, but use Intel images for the other
        # macOS cells because hosted arm64 capacity can leave jobs queued.
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-15-intel
            python-version: "3.12"
          - os: macos-15-intel
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --no-editable
      - run: uv run --no-sync pytest --cov=cnn_classifier --cov-fail-under=90

  smoke:
    name: Synthetic and bring-your-own-data smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-extras --no-editable
      - run: uv run --no-sync cnncls --help
      - run: uv run --no-sync cnncls train -c configs/tests/synthetic.yaml --set training.epochs=1 --runs-dir /tmp/cnncls-smoke
      - run: uv run --no-sync python demos/bring_your_own_data/scripts/run_quickstart.py --output-root /tmp/cnncls-byo

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-extras --no-editable
      - run: uv run --no-sync mkdocs build --strict

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-extras --no-editable
      - run: uv build
      - run: uvx twine check dist/*
      - run: uv pip install --reinstall --no-deps dist/*.whl
      - run: uv run --no-sync cnncls --version
      - run: uv run --no-sync cnncls train -c configs/tests/synthetic.yaml --set training.epochs=1 --runs-dir /tmp/wheel-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
