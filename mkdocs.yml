site_name: CNN Classifier Toolkit
site_description: A config-driven, reproducible PyTorch toolkit for CNN image classification.
site_url: https://pengzhao-ai.github.io/cnn-classifier/
repo_url: https://github.com/pengzhao-ai/cnn-classifier
repo_name: pengzhao-ai/cnn-classifier
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - How it works:
      - Overview: how_it_works.md
      - Data & configuration: configuration.md
      - Models: models.md
      - Techniques:
          - Augmentation & regularization: techniques/augmentation.md
          - Optimization & LR: techniques/optimization.md
          - Transfer learning: techniques/transfer.md
          - Evaluation rigor: techniques/evaluation.md
          - Efficiency & diagnostics: techniques/diagnostics.md
      - Extending: extending.md
  - Demos:
      - CIFAR-10 scratch: case_studies/cifar10.md
      - Transfer benchmark: case_studies/transfer.md
      - Ablations: case_studies/ablations.md
      - Optical degradation: case_studies/optics_degradation.md
      - Bring your own data: bring_your_own_data.md
  - Reference:
      - CLI: cli.md
      - API: api.md

exclude_docs: |
  superpowers/
  release.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
